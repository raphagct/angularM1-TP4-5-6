<section class="card">
  <h1>Mon profil</h1>
  @if (auth.currentUser(); as user) {
    <p>
      <b>{{ user.name }}</b><br />{{ user.email }}<br />
      Membre depuis {{ user.createdAt.slice(0, 10) }}
    </p>
    <form [formGroup]="form" (ngSubmit)="save()">
      <label>Nouveau nom<input formControlName="name" /></label>
      <button type="submit">Enregistrer</button>
    </form>
    <div class="google-link">
      <h2>Connexion Google</h2>
      <p>Associez un compte Google utilisant la même adresse email.</p>
      <div id="google-link"></div>
      @if (googleMessage()) { <p role="status">{{ googleMessage() }}</p> }
    </div>
  }
</section>
